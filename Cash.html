<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cash's Gallery</title>
  <link rel="stylesheet" href="cash-style.css">
</head>
<body>
<header>
  <h1>Cash's Gallery</h1>
  <p>Photos and videos of Cash</p>

  <!-- Dropdown menu for videos -->
  <nav class="dropdown">
    <button class="dropbtn"> Watch Cash’s Videos</button>
    <div class="dropdown-content">
      <a href="#" onclick="playVideo('Images/Videos/IMG_2286.mov')">Football Highlights</a>
      <a href="#" onclick="playVideo('Images/Videos/IMG_2290.mov')">Fishing Trip</a>
      <a href="#" onclick="playVideo('Images/Videos/IMG_2301.mov')">Family Fun</a>
    </div>
  </nav>
</header>

<!-- Photos of Cash -->
<section class="photo-group">
  <h2>Cash with Friends and Family</h2>
  <div class="fanned-gallery">
    <img src="Images/IMG_1739.jpeg" alt="Cash 1" style="--angle: -10deg" onclick="enlargeImage(this)">
    <img src="Images/IMG_1735.jpeg" alt="Cash 2" style="--angle: 0deg" onclick="enlargeImage(this)">
    <img src="Images/IMG_3849.JPEG" alt="Cash 3" style="--angle: 10deg" onclick="enlargeImage(this)">
    <img src="Images/IMG_7757.jpg" alt="Cash 4" style="--angle: 20deg" onclick="enlargeImage(this)">
  </div>
</section>

<section class="photo-group">
  <h2>Cash’s Group Photos</h2>
  <div class="fanned-gallery">
    <img src="Images/IMG_7806.jpg" alt="Cash 5" style="--angle: -10deg" onclick="enlargeImage(this)">
    <img src="Images/IMG_7793.jpg" alt="Cash 6" style="--angle: 0deg" onclick="enlargeImage(this)">
    <img src="Images/IMG_1734.jpeg" alt="Cash 7" style="--angle: 10deg" onclick="enlargeImage(this)">
  </div>
</section>

<!-- Hidden Modal for Enlarged Image -->
<div id="imageModal" class="modal" onclick="closeModal()">
  <img class="modal-content" id="modalImg" alt="Enlarged image">
</div>

<!--  Small Popup Video Modal -->
<div id="videoModal" class="video-modal">
  <div class="video-wrapper">
    <span class="close-btn" onclick="closeVideo()">&times;</span>
    <video id="modalVideo" class="video-content" controls></video>
  </div>
</div>

<!-- JavaScript for image and video modals -->
<script>
  // === Image popup modal ===
  function enlargeImage(imgElement) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    modal.style.display = "block";
    modalImg.src = imgElement.src;
  }

  function closeModal() {
    document.getElementById("imageModal").style.display = "none";
  }

  // === Video popup modal ===
  function playVideo(videoSrc) {
    const modal = document.getElementById('videoModal');
    const modalVideo = document.getElementById('modalVideo');
    modal.style.display = "flex";
    modalVideo.src = videoSrc;
    modalVideo.play();
  }

  function closeVideo() {
    const modal = document.getElementById('videoModal');
    const modalVideo = document.getElementById('modalVideo');
    modal.style.display = "none";
    modalVideo.pause();
    modalVideo.src = "";
  }
</script>
</body>
</html>
