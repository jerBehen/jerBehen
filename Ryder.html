<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryder's Gallery</title>
  <link rel="Stylesheet" href="ryder-style.css">
</head>
<body>
<header>
  <h1>Ryder's Gallery</h1>
  <p>Photo's and Videos of Ryder</p>

  <!-- Dropdown menu for videos -->
  <nav class="dropdown">
    <button class="dropbtn">Watch Ryder's Videos</button>
    <div class="dropdown-content">
      <a href="#" onclick="playVideo('Images/Videos/IMG_2286.mov')">Football Highlights</a>
    </div>
  </nav>
</header>

<!-- Photos of Ryder -->
<section class="photo-group">
  <h2></h2>
  <div class="fanned-gallery">
    <img src="Images/IMG_5512.jpg" alt="Ryder 1" style="--angle: -15deg" onclick="enlargeImage(this)">
    <img src="Images/IMG_5516.jpg" alt="Ryder 2" style="--angle: -5deg" onclick="enlargeImage(this)">
    <img src="Images/IMG_9901.JPG" alt="Ryder 3" style="--angle: 5deg" onclick="enlargeImage(this)">
  </div>
 </section>

<!-- Soccer Group -->
<section class="photo-group">
  <h2></h2>
  <div class="fanned-gallery">
    <img src="Images/DSC_4717.jpg" alt="Ryder Soccer 1" style="--angle: -15deg" onclick="enlargeImage(this)">
    <img src="Images/DSC_4760.jpg" alt="Ryder Soccer 2" style="--angle: -5deg" onclick="enlargeImage(this)">
    <img src="Images/DSC_4741.jpg" alt="Ryder Soccer 3" style="--angle: 5deg" onclick="enlargeImage(this)">
    <img src="Images/DSC_4726.jpg" alt="Ryder Soccer 4" style="--angle: 15deg" onclick="enlargeImage(this)">
  </div>
  <p class="description">

  </p>
</section>

<!-- Hidden Modal for Enlarged Image -->
<div id="imageModal" class="modal" onclick="closeModal()">
  <img class="modal-content" id="modalImg" alt="Enlarged image">
</div>

<!--  Small Popup Video Modal -->
<div id="videoModal" class="video-modal">
  <div class="video-wrapper">
    <span class="close-btn" onclick="closeVideo()">&times;</span>
    <video id="modalVideo" class="video-content" controls></video>
  </div>
</div>

<!-- JavaScript for image and video modals -->
<script>
  // === Image popup modal ===
  function enlargeImage(imgElement) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    modal.style.display = "block";
    modalImg.src = imgElement.src;
  }

  function closeModal() {
    document.getElementById("imageModal").style.display = "none";
  }

  // === Video popup modal ===
  function playVideo(videoSrc) {
    const modal = document.getElementById('videoModal');
    const modalVideo = document.getElementById('modalVideo');
    modal.style.display = "flex";
    modalVideo.src = videoSrc;
    modalVideo.play();
  }

  function closeVideo() {
    const modal = document.getElementById('videoModal');
    const modalVideo = document.getElementById('modalVideo');
    modal.style.display = "none";
    modalVideo.pause();
    modalVideo.src = "";
  }
</script>
</body>
</html>
